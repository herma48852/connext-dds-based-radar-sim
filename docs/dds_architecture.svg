<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"
     viewBox="0 0 1600 940" preserveAspectRatio="xMidYMid meet"
     font-family="Helvetica, Arial, sans-serif">

  <style>
    .participant-node,
    .endpoint-set {
      transition: opacity 160ms ease;
    }

    .participant-node {
      cursor: pointer;
    }

    .participant-node:hover rect,
    .participant-node:focus-visible rect {
      stroke: #6f8997;
    }

    .participant-node:focus {
      outline: none;
    }

    .focus-active .participant-node:not(.focused) {
      opacity: 0.2;
    }

    .focus-active .endpoint-set:not(.focused) {
      opacity: 0.08;
    }

    .focus-active .participant-node.focused rect {
      stroke: #76ded8;
      stroke-width: 4;
    }

    .focus-active .endpoint-set.focused line {
      stroke-width: 4;
    }

    .focus-active .endpoint-set.focused polygon[fill="#46d17c"] {
      stroke: #46d17c;
      stroke-width: 1.5;
    }

    .focus-active .endpoint-set.focused polygon[fill="#4fc3f7"] {
      stroke: #4fc3f7;
      stroke-width: 1.5;
    }

    .focus-active .endpoint-set.focused text {
      font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
      .participant-node,
      .endpoint-set {
        transition: none;
      }
    }
  </style>

