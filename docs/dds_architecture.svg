  <!-- footer -->
  <text x="40" y="916" font-size="10.5" fill="#6f7f76">All application types are @appendable and self-describing via the builtin TypeLookup Service &#8212; monitoring tools decode samples without the IDL file.</text>

  <script><![CDATA[
    (() => {
      const root = document.documentElement;
      const nodes = Array.from(root.querySelectorAll(".participant-node"));
      const endpointSets = Array.from(root.querySelectorAll(".endpoint-set"));
      const baseUrl = window.location.href.split("#")[0];
      let active = null;

      function applyFocus(requested, updateLocation = true) {
        const exists = nodes.some(node => node.dataset.participant === requested);
        active = exists && active !== requested ? requested : null;
        root.classList.toggle("focus-active", Boolean(active));

        for (const node of nodes) {
          const focused = node.dataset.participant === active;
          node.classList.toggle("focused", focused);
          node.setAttribute("aria-pressed", String(focused));
        }
        for (const endpointSet of endpointSets) {
          endpointSet.classList.toggle("focused", endpointSet.dataset.owner === active);
        }

        if (updateLocation) {
          try {
            history.replaceState(null, "", active ? `${baseUrl}#${active}` : baseUrl);
          } catch (_) {
            // Some embedded SVG viewers do not expose writable history.
          }
        }
      }

      for (const node of nodes) {
        node.setAttribute("aria-pressed", "false");
        node.addEventListener("click", event => {
          event.stopPropagation();
          applyFocus(node.dataset.participant);
        });
        node.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            event.stopPropagation();
            applyFocus(node.dataset.participant);
          }
        });
      }

      root.addEventListener("click", event => {
        if (!event.target.closest(".participant-node") && active) applyFocus(null);
      });
      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && active) applyFocus(null);
      });

      const initial = decodeURIComponent(window.location.hash.slice(1));
      if (initial) applyFocus(initial, false);
    })();
  ]]></script>
</svg>
