<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1280"
     font-family="Helvetica, Arial, sans-serif">
  <title>Physical radar and implemented simulation signal-processing pipelines</title>
  <desc>
    Two aligned signal-processing pipelines compare a representative physical
    four-face phased-array radar with this demo's simplified implementation.
    The figure identifies omitted element-domain processing and quantifies the
    exact implemented RawReturn and dwell-integration rates.
  </desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718092"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7be3a1"/>
    </marker>
    <style>
      .panel { fill:#0f141c; stroke:#3a4350; stroke-width:1.5; }
      .box { fill:#151b25; stroke:#566171; stroke-width:1.25; }
      .real-box { fill:#1c1916; stroke:#8b7044; stroke-width:1.25; }
      .sim-box { fill:#111c25; stroke:#397895; stroke-width:1.25; }
      .omitted { fill:#17131d; stroke:#a772c7; stroke-width:1.5;
                 stroke-dasharray:7 6; }
      .title { fill:#edf5ef; font-size:28px; font-weight:700; }
      .subtitle { fill:#9aaba0; font-size:14px; }
      .section { fill:#edf5ef; font-size:19px; font-weight:700; }
      .box-title { fill:#edf5ef; font-size:14px; font-weight:700; }
      .body { fill:#c0ccc4; font-size:12px; }
      .small { fill:#9aaba0; font-size:11px; }
      .tiny { fill:#8c9b92; font-size:10px; }
      .orange { fill:#ffbf4d; }
      .cyan { fill:#4fc3f7; }
      .green { fill:#7be3a1; }
      .purple { fill:#d18cff; }
      .rate-real { fill:#2a2116; stroke:#ffbf4d; stroke-width:1.5; }
      .rate-sim { fill:#102532; stroke:#4fc3f7; stroke-width:1.5; }
      .rate-derived { fill:#11261c; stroke:#7be3a1; stroke-width:1.5; }
      .flow { fill:none; stroke:#718092; stroke-width:2;
              marker-end:url(#arrow-gray); }
      .flow-cyan { fill:none; stroke:#4fc3f7; stroke-width:2;
                   marker-end:url(#arrow-cyan); }
      .flow-green { fill:none; stroke:#7be3a1; stroke-width:2;
                    marker-end:url(#arrow-green); }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#0a0a0f"/>
  <text x="900" y="43" text-anchor="middle" class="title">
    From Element Samples to Tracks
  </text>
  <text x="900" y="70" text-anchor="middle" class="subtitle">
    Representative physical processing versus the exact simplified DDS demo path
  </text>

  <!-- Legend -->
  <g transform="translate(560 87)">
    <rect x="0" y="0" width="16" height="11" rx="2" fill="#2a2116"
          stroke="#ffbf4d"/>
    <text x="24" y="10" class="small">physical reference rate</text>
    <rect x="225" y="0" width="16" height="11" rx="2" fill="#102532"
          stroke="#4fc3f7"/>
    <text x="249" y="10" class="small">implemented rate</text>
    <rect x="432" y="0" width="16" height="11" rx="2" fill="#17131d"
          stroke="#d18cff" stroke-dasharray="4 3"/>
    <text x="456" y="10" class="small">not explicitly modeled</text>
  </g>

  <!-- Representative physical receive chain -->
  <rect x="40" y="115" width="1720" height="355" rx="12" class="panel"/>
  <text x="68" y="150" class="section">
    PHYSICAL RADAR REFERENCE PATH
  </text>
  <text x="430" y="150" class="small">
    same modeled aperture, bandwidth, range window, and PRF · processing order varies by architecture
  </text>
  <rect x="1456" y="130" width="276" height="28" rx="14"
        fill="#2a2116" stroke="#ffbf4d"/>
  <text x="1594" y="149" text-anchor="middle" class="small orange"
        font-weight="700">REPRESENTATIVE — NOT SPY-6 DATA</text>

  <!-- Real-chain boxes -->
  <g>
    <rect x="65" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="170" y="207" text-anchor="middle" class="box-title">1 · ARRAY APERTURE</text>
    <text x="170" y="235" text-anchor="middle" class="body">4 faces × 1,024 T/R elements</text>
    <text x="170" y="256" text-anchor="middle" class="body">4,096 receive channels</text>
    <text x="170" y="288" text-anchor="middle" class="small">analog RF at each element</text>

    <path d="M275 251 H294" class="flow"/>

    <rect x="300" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="405" y="207" text-anchor="middle" class="box-title">2 · RF / DIGITIZE</text>
    <text x="405" y="235" text-anchor="middle" class="body">LNA · downconversion · ADC</text>
    <text x="405" y="256" text-anchor="middle" class="body">I/Q channel streams</text>
    <text x="405" y="288" text-anchor="middle" class="small">668 gated samples / PRI / channel</text>

    <path d="M510 251 H529" class="flow"/>

    <rect x="535" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="640" y="207" text-anchor="middle" class="box-title">3 · CALIBRATE</text>
    <text x="640" y="235" text-anchor="middle" class="body">per-element gain and phase</text>
    <text x="640" y="256" text-anchor="middle" class="body">channel alignment / equalization</text>
    <text x="640" y="288" text-anchor="middle" class="small">still 1,024 streams per face</text>

    <path d="M745 251 H764" class="flow"/>

    <rect x="770" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="875" y="207" text-anchor="middle" class="box-title">4 · BEAMFORM</text>
    <text x="875" y="235" text-anchor="middle" class="body">complex weighted element sum</text>
    <text x="875" y="256" text-anchor="middle" class="body">1,024 channels → selected beam</text>
    <text x="875" y="288" text-anchor="middle" class="small">one or more beams per face</text>

    <path d="M980 251 H999" class="flow"/>

    <rect x="1005" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="1110" y="207" text-anchor="middle" class="box-title">5 · RANGE / DOPPLER</text>
    <text x="1110" y="235" text-anchor="middle" class="body">matched-filter pulse compression</text>
    <text x="1110" y="256" text-anchor="middle" class="body">coherent Doppler filter bank</text>
    <text x="1110" y="288" text-anchor="middle" class="small">range–velocity cells</text>

    <path d="M1215 251 H1234" class="flow"/>

    <rect x="1240" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="1345" y="207" text-anchor="middle" class="box-title">6 · DETECT / ANGLE</text>
    <text x="1345" y="235" text-anchor="middle" class="body">clutter map · adaptive CFAR</text>
    <text x="1345" y="256" text-anchor="middle" class="body">monopulse / beam comparison</text>
    <text x="1345" y="288" text-anchor="middle" class="small">sparse measurement plots</text>

    <path d="M1450 251 H1469" class="flow"/>

    <rect x="1475" y="180" width="210" height="142" rx="8" class="real-box"/>
    <text x="1580" y="207" text-anchor="middle" class="box-title">7 · TRACK</text>
    <text x="1580" y="235" text-anchor="middle" class="body">association · state estimator</text>
    <text x="1580" y="256" text-anchor="middle" class="body">initiation · coast · drop</text>
    <text x="1580" y="288" text-anchor="middle" class="small">confirmed track reports</text>
  </g>

  <!-- Real rate cards -->
  <rect x="65" y="345" width="760" height="88" rx="8" class="rate-real"/>
  <text x="87" y="372" class="box-title orange">
    ELEMENT-DOMAIN WORKLOAD · 2.736 billion complex range samples / second
  </text>
  <text x="87" y="397" class="body">
    4 faces × 1,024 channels × 668 cells/PRI × 1,000 PRI/s
  </text>
  <text x="87" y="417" class="small">
    This is the physical sample-count scale before the element channels are combined.
  </text>

  <rect x="845" y="345" width="840" height="88" rx="8" class="rate-real"/>
  <text x="867" y="372" class="box-title orange">
    ILLUSTRATIVE ELEMENT DATA · 10.94 GB/s = 87.6 Gb/s
  </text>
  <text x="867" y="397" class="body">
    assumes one 16-bit I + one 16-bit Q value per gated complex sample; payload only
  </text>
  <text x="867" y="417" class="small">
    Wider operational bandwidths, oversampling, extra beams, and framing can raise this substantially.
  </text>

  <!-- Abstraction boundary -->
  <rect x="40" y="491" width="1720" height="67" rx="10" class="omitted"/>
  <text x="900" y="519" text-anchor="middle" class="box-title purple">
    SIMULATION ABSTRACTION BOUNDARY
  </text>
  <text x="900" y="543" text-anchor="middle" class="body">
    Element RF, ADC, channel calibration, beamforming arithmetic, Doppler filtering, adaptive clutter processing, and monopulse are not executed.
  </text>

  <!-- Implemented chain -->
  <rect x="40" y="580" width="1720" height="445" rx="12" class="panel"/>
  <text x="68" y="615" class="section">IMPLEMENTED SIMULATION PATH</text>
  <text x="395" y="615" class="small">
    exact rates and simplifications in the current source
  </text>
  <rect x="1510" y="595" width="222" height="28" rx="14"
        fill="#102532" stroke="#4fc3f7"/>
  <text x="1621" y="614" text-anchor="middle" class="small cyan"
        font-weight="700">DDS-VISIBLE WHERE LABELED</text>

  <!-- Implemented boxes -->
  <g>
    <rect x="65" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="170" y="672" text-anchor="middle" class="box-title">1 · SCENE MODEL</text>
    <text x="170" y="699" text-anchor="middle" class="body">TargetTruth: 50 Hz / target</text>
    <text x="170" y="720" text-anchor="middle" class="body">beam pattern: 20 Hz / face</text>
    <text x="170" y="748" text-anchor="middle" class="small">truth + array-factor equations</text>
    <text x="170" y="770" text-anchor="middle" class="tiny">replace element-channel input</text>

    <path d="M275 724 H294" class="flow-cyan"/>

    <rect x="300" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="405" y="672" text-anchor="middle" class="box-title">2 · SYNTHESIZE I/Q</text>
    <text x="405" y="699" text-anchor="middle" class="body">post-beamformed RawReturn</text>
    <text x="405" y="720" text-anchor="middle" class="body">668 complex float32 cells</text>
    <text x="405" y="748" text-anchor="middle" class="small">1,000 samples/s/face</text>
    <text x="405" y="770" text-anchor="middle" class="tiny">BEST_EFFORT DDS loopback</text>

    <path d="M510 724 H529" class="flow-cyan"/>

    <rect x="535" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="640" y="672" text-anchor="middle" class="box-title">3 · DWELL INTEGRATE</text>
    <text x="640" y="699" text-anchor="middle" class="body">noncoherent I² + Q² average</text>
    <text x="640" y="720" text-anchor="middle" class="body">10 pulses → one RMS trace</text>
    <text x="640" y="748" text-anchor="middle" class="small">100 traces/s/face</text>
    <text x="640" y="770" text-anchor="middle" class="tiny">in-process A-scope state</text>

    <path d="M745 724 H764" class="flow-cyan"/>

    <rect x="770" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="875" y="672" text-anchor="middle" class="box-title">4 · EXTRACT PEAKS</text>
    <text x="875" y="699" text-anchor="middle" class="body">fixed threshold + local maximum</text>
    <text x="875" y="720" text-anchor="middle" class="body">compressed 3-bin response</text>
    <text x="875" y="748" text-anchor="middle" class="small">0…N plots per dwell</text>
    <text x="875" y="770" text-anchor="middle" class="tiny">DetectionEvent over DDS</text>

    <path d="M980 724 H999" class="flow-green"/>

    <rect x="1005" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="1110" y="672" text-anchor="middle" class="box-title">5 · FUSE PLOTS</text>
    <text x="1110" y="699" text-anchor="middle" class="body">range / time / angle clustering</text>
    <text x="1110" y="720" text-anchor="middle" class="body">SNR-power bearing centroid</text>
    <text x="1110" y="748" text-anchor="middle" class="small">removes beam / face duplicates</text>
    <text x="1110" y="770" text-anchor="middle" class="tiny">resolution-cell model</text>

    <path d="M1215 724 H1234" class="flow-green"/>

    <rect x="1240" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="1345" y="672" text-anchor="middle" class="box-title">6 · TRACKER CORE</text>
    <text x="1345" y="699" text-anchor="middle" class="body">nearest neighbor · α–β filter</text>
    <text x="1345" y="720" text-anchor="middle" class="body">3 visits in 5 volumes</text>
    <text x="1345" y="748" text-anchor="middle" class="small">12 s confirmed-track coast</text>
    <text x="1345" y="770" text-anchor="middle" class="tiny">10 Hz update cycle</text>

    <path d="M1450 724 H1469" class="flow-green"/>

    <rect x="1475" y="645" width="210" height="158" rx="8" class="sim-box"/>
    <text x="1580" y="672" text-anchor="middle" class="box-title">7 · TRACK OUTPUT</text>
    <text x="1580" y="699" text-anchor="middle" class="body">TargetTrack: 10 Hz / track</text>
    <text x="1580" y="720" text-anchor="middle" class="body">RELIABLE + transient-local</text>
    <text x="1580" y="748" text-anchor="middle" class="small">HMI + Connext Studio</text>
    <text x="1580" y="770" text-anchor="middle" class="tiny">sparse operational product</text>
  </g>

  <!-- Implemented rate ladder -->
  <text x="68" y="839" class="box-title">IMPLEMENTED RATE LADDER</text>
  <text x="305" y="839" class="small">payload values exclude DDS/CDR framing</text>

  <rect x="65" y="858" width="370" height="122" rx="8" class="rate-sim"/>
  <text x="86" y="884" class="box-title cyan">RAWRETURN DDS</text>
  <text x="86" y="909" class="body">2.672 M complex cells/s aggregate</text>
  <text x="86" y="932" class="body">21.376 MB/s · 171.0 Mb/s</text>
  <text x="86" y="956" class="small">4 faces × 668 × 1,000 × 8 bytes</text>

  <path d="M435 919 H471" class="flow-cyan"/>
  <text x="453" y="902" text-anchor="middle" class="small cyan">10:1</text>

  <rect x="477" y="858" width="370" height="122" rx="8" class="rate-sim"/>
  <text x="498" y="884" class="box-title cyan">INTEGRATED TRACES</text>
  <text x="498" y="909" class="body">267,200 magnitude cells/s</text>
  <text x="498" y="932" class="body">1.069 MB/s float32 equivalent</text>
  <text x="498" y="956" class="small">400 dwells/s × 668 × 4 bytes · internal</text>

  <path d="M847 919 H883" class="flow-green"/>
  <text x="865" y="902" text-anchor="middle" class="small green">sparse</text>

  <rect x="889" y="858" width="370" height="122" rx="8" class="rate-derived"/>
  <text x="910" y="884" class="box-title green">DETECTION EVENTS</text>
  <text x="910" y="909" class="body">data-dependent plot rate</text>
  <text x="910" y="932" class="body">only local peaks above threshold</text>
  <text x="910" y="956" class="small">metadata reports, not range-cell arrays</text>

  <path d="M1259 919 H1295" class="flow-green"/>
  <text x="1277" y="902" text-anchor="middle" class="small green">associate</text>

  <rect x="1301" y="858" width="384" height="122" rx="8" class="rate-derived"/>
  <text x="1322" y="884" class="box-title green">TARGETTRACK DDS</text>
  <text x="1322" y="909" class="body">10 × confirmed-track count samples/s</text>
  <text x="1322" y="932" class="body">for example: 5 tracks → 50 samples/s</text>
  <text x="1322" y="956" class="small">bounded, stable display / integration product</text>

  <!-- Interpretation -->
  <rect x="40" y="1046" width="1720" height="194" rx="12" class="panel"/>
  <text x="68" y="1082" class="section">WHAT THE REDUCTION MEANS</text>

  <rect x="65" y="1101" width="520" height="108" rx="8" class="box"/>
  <text x="87" y="1129" class="box-title purple">1,024:1 ELEMENT-SAMPLE REDUCTION</text>
  <text x="87" y="1153" class="body">The implementation starts after beamforming: four streams</text>
  <text x="87" y="1173" class="body">replace 4,096 element channels. Complex-sample workload is</text>
  <text x="87" y="1193" class="body">2.736 G/s physical-reference versus 2.672 M/s implemented.</text>

  <rect x="608" y="1101" width="520" height="108" rx="8" class="box"/>
  <text x="630" y="1129" class="box-title cyan">THEN 10:1 TIME INTEGRATION</text>
  <text x="630" y="1153" class="body">Ten 1 kHz pulse returns become one 100 Hz dwell trace per</text>
  <text x="630" y="1173" class="body">face. Thresholding and tracking reduce the flow again from</text>
  <text x="630" y="1193" class="body">dense range arrays to sparse measurements and state vectors.</text>

  <rect x="1151" y="1101" width="534" height="108" rx="8" class="box"/>
  <text x="1173" y="1129" class="box-title orange">3 GHz IS NOT THE DIGITAL DATA RATE</text>
  <text x="1173" y="1153" class="body">The RF carrier is downconverted. Bandwidth, receive-window</text>
  <text x="1173" y="1173" class="body">samples, channel count, quantization, and beam count set the</text>
  <text x="1173" y="1193" class="body">processing rate. This diagram uses the demo's 1 MHz model.</text>

  <text x="900" y="1262" text-anchor="middle" class="small">
    Rates are decimal SI payload rates. The physical lane is an engineering reference using public round-number assumptions, not an operational-system claim.
  </text>
</svg>
